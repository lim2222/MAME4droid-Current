// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
		classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Android Studio's Gradle sync requests the 'prepareKotlinBuildScriptModel' task, which is
    // normally provided by the Kotlin Gradle Plugin. This is a Java-only project and AGP 9's
    // built-in Kotlin no longer registers that task, so define a no-op to let IDE sync succeed.
    if (tasks.findByName("prepareKotlinBuildScriptModel") == null) {
        tasks.register("prepareKotlinBuildScriptModel")
    }

/*    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }*/
}


